<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Interactive touchscreen panel">
  <defs>
    <linearGradient id="bgp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2230"/>
      <stop offset="1" stop-color="#0f141d"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#20608f"/>
      <stop offset="0.5" stop-color="#2f82b8"/>
      <stop offset="1" stop-color="#173a57"/>
    </linearGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b323d"/>
      <stop offset="1" stop-color="#171c24"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bgp)"/>

  <!-- soft shadow -->
  <ellipse cx="400" cy="520" rx="250" ry="24" fill="#000000" opacity="0.28"/>

  <!-- panel bezel -->
  <rect x="150" y="110" width="500" height="320" rx="20" fill="url(#bezel)"/>
  <rect x="150" y="110" width="500" height="320" rx="20" fill="none" stroke="#3a424e" stroke-width="2"/>

  <!-- screen -->
  <rect x="172" y="132" width="456" height="276" rx="8" fill="url(#screen)"/>

  <!-- on-screen content: chart bars + lines -->
  <g opacity="0.92">
    <rect x="210" y="300" width="36" height="70" rx="4" fill="#bfe7ff"/>
    <rect x="258" y="270" width="36" height="100" rx="4" fill="#bfe7ff"/>
    <rect x="306" y="240" width="36" height="130" rx="4" fill="#ffffff"/>
    <polyline points="210,220 270,250 330,200 400,235 470,175 560,205" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="470" cy="175" r="8" fill="#ffffff"/>
  </g>

  <!-- camera dot -->
  <circle cx="400" cy="123" r="4" fill="#5a6472"/>

  <!-- stand -->
  <rect x="388" y="430" width="24" height="60" fill="#3a424e"/>
  <rect x="300" y="488" width="200" height="16" rx="6" fill="#4a535f"/>

  <!-- touch indicator (hand/stylus point) -->
  <circle cx="486" cy="330" r="26" fill="#ffffff" opacity="0.18"/>
  <circle cx="486" cy="330" r="13" fill="#ffffff" opacity="0.5"/>
  <circle cx="486" cy="330" r="6" fill="#ffffff"/>
</svg>
